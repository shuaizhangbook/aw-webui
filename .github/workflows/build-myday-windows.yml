name: Build SeeSeeYou Windows desktop

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-myday-windows.yml
      - desktop/**
      - desktop/assets/seeseeyou-icon.*
      - src/App.vue
      - src/components/Header.vue
      - src/i18n/**
      - src/route.js
      - src/util/seeseeyou.ts
      - src/views/MyDay.vue

permissions:
  contents: read

env:
  TAURI_BUILD: 'true'
  AW_DISABLE_AUTO_UPDATE: 'true'

jobs:
  build-windows-desktop:
    name: SeeSeeYou Windows desktop
    runs-on: windows-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the SeeSeeYou web UI
        uses: actions/checkout@v7
        with:
          path: custom-webui

      - name: Check out the desktop engine
        run: |
          git clone https://github.com/ActivityWatch/activitywatch.git activitywatch
          git -C activitywatch checkout 115e49e111cd0a248be6230680544235ae3a5a8e
          git -C activitywatch submodule update --init --recursive --depth 1

      - name: Check out the SeeSeeYou sync agent
        run: |
          git clone https://github.com/shuaizhangbook/seeseeyou.git seeseeyou
          git -C seeseeyou checkout 36533603fa8de87efe8ed4f61976a81af4d4e772

      - name: Apply SeeSeeYou desktop customizations
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=coverage \
            -C custom-webui \
            -cf - . \
            | tar -C activitywatch/aw-tauri/aw-webui -xf -
          git -C activitywatch/aw-tauri apply \
            "$GITHUB_WORKSPACE/custom-webui/desktop/patches/aw-tauri-seeseeyou.patch"
          cp custom-webui/desktop/aw-tauri.iss activitywatch/scripts/package/aw-tauri.iss

      - name: Verify the desktop port migration contract
        run: |
          grep -F 'port: 5600' activitywatch/aw-tauri/src-tauri/src/lib.rs
          grep -F 'Migrated SeeSeeYou local port from 5601 to 5600' activitywatch/aw-tauri/src-tauri/src/lib.rs
          grep -F 'Migrated SeeSeeYou sync API from port 5601 to 5600' activitywatch/aw-tauri/src-tauri/src/lib.rs
          grep -F 'commands.allow = ["get_sync_status"]' activitywatch/aw-tauri/src-tauri/permissions/sync-control.toml
          grep -F 'commands.allow = ["configure_sync"]' activitywatch/aw-tauri/src-tauri/permissions/sync-control.toml
          grep -F 'commands.allow = ["clear_sync"]' activitywatch/aw-tauri/src-tauri/permissions/sync-control.toml
          grep -F '"http://localhost:5600/*"' activitywatch/aw-tauri/src-tauri/capabilities/default.json
          grep -F '"allow-get-sync-status"' activitywatch/aw-tauri/src-tauri/capabilities/default.json
          grep -F '"allow-configure-sync"' activitywatch/aw-tauri/src-tauri/capabilities/default.json
          grep -F '"allow-clear-sync"' activitywatch/aw-tauri/src-tauri/capabilities/default.json
          grep -F 'target.origin === window.location.origin' activitywatch/aw-tauri/src-tauri/src/lib.rs
          grep -F '"version": "0.1.2"' activitywatch/aw-tauri/src-tauri/tauri.conf.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: custom-webui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test SeeSeeYou Google sign-in helpers
        working-directory: custom-webui
        run: |
          npm ci
          npm run test:unit -- --runInBand test/unit/seeseeyou.test.js

      - name: Generate SeeSeeYou desktop icons
        working-directory: activitywatch/aw-tauri
        run: |
          npm ci
          npm run tauri icon "$GITHUB_WORKSPACE/custom-webui/desktop/assets/seeseeyou-icon.png"

      - name: Test desktop sync configuration compatibility
        working-directory: activitywatch/aw-tauri/src-tauri
        run: cargo test sync_config_ --lib

      - name: Install packaging dependencies
        run: |
          choco install innosetup -y --no-progress
          python -m pip install poetry==2.2.1 pyinstaller==6.15.0

      - name: Build the background sync program
        working-directory: seeseeyou/admin/client
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name seeseeyou-sync \
            --paths . \
            usage-sync.py

      - name: Build SeeSeeYou desktop
        working-directory: activitywatch
        run: |
          python -m venv venv
          source venv/Scripts/activate
          poetry install
          make build TAURI_BUILD=true

      - name: Create Windows installer and portable ZIP
        working-directory: activitywatch
        run: |
          source venv/Scripts/activate
          make package TAURI_BUILD=true
          cp ../seeseeyou/admin/client/dist/seeseeyou-sync.exe dist/activitywatch/seeseeyou-sync.exe
          rm -f dist/*.zip dist/*-setup.exe
          bash scripts/package/package-all.sh
          setup_file=$(find dist -maxdepth 1 -name '*-setup.exe' -print -quit)
          zip_file=$(find dist -maxdepth 1 -name '*.zip' -print -quit)
          mv "$setup_file" dist/SeeSeeYou-0.1.2-windows-x86_64-setup.exe
          mv "$zip_file" dist/SeeSeeYou-0.1.2-windows-x86_64-portable.zip

      - name: Show generated packages
        working-directory: activitywatch
        run: ls -lh dist/

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: SeeSeeYou-0.1.2-Windows
          if-no-files-found: error
          retention-days: 14
          path: |
            activitywatch/dist/SeeSeeYou-0.1.2-windows-x86_64-setup.exe
            activitywatch/dist/SeeSeeYou-0.1.2-windows-x86_64-portable.zip
