name: Build My Day Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the customized web UI
        uses: actions/checkout@v7
        with:
          path: custom-webui

      - name: Check out the ActivityWatch desktop bundle
        run: |
          git clone https://github.com/ActivityWatch/activitywatch.git activitywatch
          git -C activitywatch checkout 115e49e111cd0a248be6230680544235ae3a5a8e
          git -C activitywatch submodule update --init --recursive --depth 1

      - name: Overlay the customized My Day web UI
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=coverage \
            -C custom-webui \
            -cf - . \
            | tar -C activitywatch/aw-server/aw-webui -xf -

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: custom-webui/package-lock.json

      - name: Install packaging dependencies
        run: |
          choco install innosetup -y --no-progress
          python -m pip install poetry==2.2.1

      - name: Build ActivityWatch with My Day
        working-directory: activitywatch
        run: |
          python -m venv venv
          source venv/Scripts/activate
          poetry install
          make build SKIP_SERVER_RUST=true

      - name: Create Windows installer and portable ZIP
        working-directory: activitywatch
        run: |
          source venv/Scripts/activate
          make package SKIP_SERVER_RUST=true

      - name: Show generated packages
        working-directory: activitywatch
        run: ls -lh dist/

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: activitywatch-myday-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            activitywatch/dist/activitywatch-*-windows-*-setup.exe
            activitywatch/dist/activitywatch-*-windows-*.zip
