<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src ipc: http://ipc.localhost https://ipc.localhost;">
  <title>Claritide · AI 工作台</title>
  <style>
    :root {
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #222320;
      background: #fff;
      --ink: #222320;
      --muted: #696b66;
      --dim: #969892;
      --line: #e7e8e4;
      --line-strong: #d8dad4;
      --sidebar: #f3f3f0;
      --soft: #f7f7f5;
      --active: #e8e8e4;
      --surface: #fff;
      --mint: #0b8f84;
      --mint-dark: #08756d;
      --mint-soft: #e7f6f3;
      --red: #b5444d;
      --red-soft: #fff2f2;
      --amber: #805b19;
      --amber-soft: #fff7e6;
      --shadow: 0 14px 38px rgba(29, 31, 27, .13);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 320px; height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--surface); color: var(--ink); font-size: 14px; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(11, 143, 132, .18);
      outline-offset: 2px;
    }
    [hidden] { display: none !important; }

    .app { height: 100vh; display: grid; grid-template-columns: 276px minmax(0, 1fr); }
    .sidebar {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      border-right: 1px solid var(--line);
      background: var(--sidebar);
    }
    .sidebar-head { height: 56px; display: flex; align-items: center; gap: 9px; padding: 0 14px; }
    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--mint);
      color: #fff;
      font-weight: 800;
    }
    .brand-name { font-size: 14px; font-weight: 750; }
    .spacer { flex: 1; }
    .text-button {
      min-height: 32px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }
    .text-button:hover { background: var(--active); color: var(--ink); }
    .new-chat {
      height: 40px;
      margin: 3px 10px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      font-weight: 650;
      text-align: left;
    }
    .new-chat:hover { background: var(--active); }
    .shortcut { color: var(--dim); font-size: 11px; font-weight: 500; }
    .sidebar-scroll { min-height: 0; overflow: auto; padding: 0 8px 18px; }
    .section-head { height: 34px; display: flex; align-items: center; padding: 0 7px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .section-head button { margin-left: auto; }
    .compact-action {
      min-width: 28px;
      height: 28px;
      padding: 0 7px;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }
    .compact-action:hover { background: var(--active); color: var(--ink); }
    .empty-projects { margin: 6px 5px; padding: 14px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .project { margin-bottom: 4px; }
    .item-shell {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 30px;
      align-items: center;
      border-radius: 8px;
    }
    .item-shell:hover, .item-shell.active { background: var(--active); }
    .project-row, .session-row { width: 100%; min-width: 0; border: 0; background: transparent; text-align: left; }
    .project-row { height: 38px; padding: 0 7px; font-weight: 650; }
    .session-row { min-height: 34px; padding: 6px 7px 6px 25px; color: #454743; font-size: 12px; }
    .project-name, .session-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-list { padding: 1px 0 4px; }
    .session-shell.active { background: #dcdcd7; }
    .item-menu { position: relative; height: 28px; }
    .item-menu summary {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: var(--muted);
      cursor: pointer;
      list-style: none;
      opacity: 0;
      font-size: 11px;
    }
    .item-shell:hover .item-menu summary, .item-menu[open] summary { opacity: 1; }
    .item-menu summary::-webkit-details-marker, .header-menu summary::-webkit-details-marker { display: none; }
    .menu-popover {
      position: absolute;
      right: 0;
      top: 30px;
      z-index: 30;
      width: 138px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .menu-popover button { width: 100%; height: 33px; padding: 0 9px; border: 0; border-radius: 7px; background: transparent; text-align: left; font-size: 12px; }
    .menu-popover button:hover { background: var(--soft); }
    .menu-popover .danger { color: var(--red); }
    .sidebar-foot { min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
    .status-dot.ready { background: var(--mint); }

    .main { min-width: 0; min-height: 0; position: relative; display: grid; grid-template-rows: 56px minmax(0, 1fr); background: #fff; }
    .main-head { display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--line); }
    .conversation-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
    .conversation-path { min-width: 0; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); font-size: 11px; }
    .header-menu { position: relative; }
    .header-menu summary { min-width: 34px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); cursor: pointer; list-style: none; }
    .header-menu summary:hover, .header-menu[open] summary { background: var(--soft); color: var(--ink); }
    .header-menu .menu-popover { top: 36px; }
    .conversation { min-height: 0; overflow: auto; padding: 28px 0 170px; scroll-behavior: smooth; }
    .conversation-inner { width: min(820px, calc(100% - 56px)); margin: 0 auto; }
    .welcome { min-height: 330px; display: grid; place-items: center; text-align: center; }
    .welcome h1 { margin: 0 0 9px; color: var(--ink); font-size: 21px; font-weight: 720; }
    .welcome p { max-width: 500px; margin: 0; color: var(--muted); line-height: 1.7; }
    .message { padding: 16px 0; }
    .message.user { display: flex; justify-content: flex-end; }
    .user-bubble { max-width: min(620px, 82%); padding: 10px 14px; border-radius: 16px; background: var(--soft); color: #30322f; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.agent { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; }
    .agent-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--mint); color: #fff; font-size: 10px; font-weight: 800; }
    .message-head { display: flex; align-items: center; gap: 8px; margin: 2px 0 7px; }
    .message-head strong { font-size: 12px; }
    .message-head span { color: var(--dim); font-size: 10px; }
    .message-body { white-space: pre-wrap; overflow-wrap: anywhere; color: #30322f; line-height: 1.72; }
    .message-attachments { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; margin-bottom: 6px; }
    .attachment-label { padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--muted); font-size: 10px; }
    .run-indicator { margin: 12px 0 16px 42px; display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; }
    .run-indicator button { border: 0; background: transparent; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px var(--mint-soft); animation: breathe 1.5s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: .42; transform: scale(.78); } }
    .result-card, .error-card, .approval-card { margin: 12px 0 16px 42px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .result-card { background: #fbfcfb; }
    .error-card { border-color: #efd1d4; background: var(--red-soft); }
    .approval-card { border-color: #ead8aa; background: var(--amber-soft); }
    .card-title { margin: 0 0 5px; font-size: 12px; font-weight: 700; }
    .card-copy { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .card-button { min-height: 31px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; color: var(--ink); font-size: 11px; }
    .card-button:hover { background: var(--soft); }
    .message-body.formatted { white-space: normal; }
    .message-body.formatted > :first-child { margin-top: 0; }
    .message-body.formatted > :last-child { margin-bottom: 0; }
    .message-body.formatted p { margin: 10px 0; white-space: pre-wrap; }
    .message-body.formatted h1, .message-body.formatted h2, .message-body.formatted h3 { margin: 21px 0 9px; line-height: 1.4; font-size: 17px; }
    .message-body.formatted h1 { font-size: 20px; }
    .message-body.formatted h3 { font-size: 15px; }
    .message-body.formatted ul, .message-body.formatted ol { margin: 10px 0; padding-left: 24px; }
    .message-body.formatted li { margin: 4px 0; }
    .message-body.formatted blockquote { margin: 12px 0; padding: 2px 14px; border-left: 3px solid var(--line-strong); color: var(--muted); white-space: pre-wrap; }
    .message-body.formatted code { padding: 2px 5px; border-radius: 4px; background: var(--soft); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .9em; }
    .markdown-code { min-width: 0; margin: 13px 0; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; }
    .markdown-code-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 10px; background: var(--soft); color: var(--muted); font-size: 11px; }
    .markdown-code pre { max-height: 460px; overflow: auto; margin: 0; padding: 13px; line-height: 1.6; white-space: pre; }
    .message-body.formatted .markdown-code code { padding: 0; background: transparent; }
    .markdown-code .card-button { min-height: 28px; }
    .markdown-link { display: inline; padding: 0; border: 0; background: transparent; color: var(--mint-dark); text-align: left; text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere; font: inherit; }
    .markdown-link small { margin-left: 4px; color: var(--muted); font-size: 10px; text-decoration: none; }
    .markdown-table-wrap { max-width: 100%; margin: 13px 0; overflow-x: auto; }
    .markdown-table-wrap table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .markdown-table-wrap th, .markdown-table-wrap td { padding: 8px 10px; border: 1px solid var(--line); text-align: left; vertical-align: top; min-width: 90px; }
    .markdown-table-wrap th { background: var(--soft); font-weight: 650; }
    .approval-operation { margin: 9px 0; padding: 10px; max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 7px; background: #fff; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .approval-details { margin: 10px 0; color: var(--muted); font-size: 11px; }
    .approval-details summary { cursor: pointer; }
    .approval-details pre { max-height: 260px; overflow: auto; padding: 10px; border: 1px solid var(--line); border-radius: 7px; background: #fff; white-space: pre-wrap; overflow-wrap: anywhere; }

    .composer-wrap { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 24px 22px; background: linear-gradient(180deg, rgba(255,255,255,0), #fff 28px); }
    .composer { width: min(820px, calc(100% - 8px)); margin: 0 auto; border: 1px solid #dadcd6; border-radius: 19px; background: #fff; box-shadow: 0 7px 24px rgba(30, 32, 29, .09); }
    .composer:focus-within { border-color: #c7c9c3; box-shadow: 0 9px 28px rgba(30, 32, 29, .12); }
    .composer textarea { width: 100%; min-height: 66px; max-height: 160px; resize: none; padding: 16px 16px 6px; border: 0; outline: 0; background: transparent; line-height: 1.55; }
    .attachment-tray { display: flex; flex-wrap: wrap; gap: 6px; padding: 1px 12px 7px; }
    .attachment-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 220px; min-height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); color: var(--muted); font-size: 10px; }
    .attachment-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attachment-chip button { padding: 0; border: 0; background: transparent; color: var(--dim); font-size: 10px; }
    .composer-row { min-height: 46px; display: flex; align-items: center; gap: 6px; padding: 5px 8px 8px; }
    .composer-control { position: relative; }
    .composer-button { height: 32px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: #5f615c; font-size: 11px; white-space: nowrap; }
    .composer-button:hover, .composer-button[aria-expanded="true"] { background: var(--soft); color: var(--ink); }
    .composer-button:disabled { cursor: not-allowed; opacity: .42; }
    .project-button { max-width: 185px; overflow: hidden; text-overflow: ellipsis; }
    .model-effort-button { max-width: 210px; background: var(--soft); color: var(--ink); }
    .voice-button.listening { background: var(--mint-soft); color: var(--mint-dark); }
    .send-button { min-width: 58px; height: 34px; padding: 0 13px; border: 0; border-radius: 10px; background: #1b1c1a; color: #fff; font-size: 11px; font-weight: 700; }
    .send-button.stop-state { background: var(--red); }
    .send-button:disabled { cursor: not-allowed; opacity: .26; }
    .control-popover {
      position: absolute;
      left: 0;
      bottom: 40px;
      z-index: 40;
      width: 290px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .control-popover.align-right { right: 0; left: auto; width: 324px; padding: 12px; }
    .popover-title { padding: 3px 6px 7px; color: var(--dim); font-size: 10px; font-weight: 700; }
    .popover-list { display: grid; gap: 2px; }
    .popover-option { width: 100%; min-height: 40px; padding: 7px 9px; border: 0; border-radius: 9px; background: transparent; text-align: left; }
    .popover-option:hover, .popover-option.selected { background: var(--soft); }
    .option-title { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 650; }
    .option-title .check { margin-left: auto; color: var(--mint-dark); }
    .option-copy { margin-top: 3px; color: var(--dim); font-size: 10px; line-height: 1.45; }
    .popover-divider { height: 1px; margin: 7px 3px; background: var(--line); }
    .model-field label, .effort-field legend { display: block; margin: 0 0 7px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .model-field select { width: 100%; height: 39px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
    .effort-field { margin: 14px 0 0; padding: 0; border: 0; }
    .effort-value { float: right; color: var(--mint-dark); font-weight: 700; }
    .effort-field input[type="range"] { width: 100%; accent-color: var(--mint); }
    .effort-scale { display: flex; justify-content: space-between; color: var(--dim); font-size: 9px; }
    .popover-note { margin: 9px 2px 1px; color: var(--dim); font-size: 10px; line-height: 1.5; }

    .activity { position: absolute; top: 56px; right: 0; bottom: 0; z-index: 25; width: 360px; display: grid; grid-template-rows: 50px minmax(0, 1fr); border-left: 1px solid var(--line); background: #fff; box-shadow: -12px 0 30px rgba(30, 32, 29, .08); }
    .activity-head { display: flex; align-items: center; gap: 7px; padding: 0 13px; border-bottom: 1px solid var(--line); }
    .activity-head small { color: var(--dim); }
    .activity-head button { margin-left: auto; }
    .activity-body { min-height: 0; overflow: auto; }
    .activity-empty { padding: 28px 18px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .log-item { padding: 11px 13px; border-bottom: 1px solid var(--line); }
    .log-item strong { display: block; margin-bottom: 4px; font-size: 11px; }
    .log-item p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.55; overflow-wrap: anywhere; }
    .log-time { float: right; color: var(--dim); font-weight: 400; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; padding: 22px; background: rgba(24, 27, 23, .32); }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(470px, 100%); max-height: calc(100vh - 44px); overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: var(--shadow); }
    .modal header { display: flex; align-items: center; justify-content: space-between; padding: 15px 17px; border-bottom: 1px solid var(--line); }
    .modal h2 { margin: 0; font-size: 16px; }
    .modal-body { padding: 16px 17px; }
    .modal-copy { margin: 0 0 13px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .form-field { margin-bottom: 13px; }
    .form-field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .form-field input { width: 100%; height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .warning { padding: 12px; border: 1px solid #ecd3a4; border-radius: 9px; background: var(--amber-soft); color: #75561e; font-size: 11px; line-height: 1.65; }
    .modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: 11px 17px 15px; }
    .btn { min-height: 36px; padding: 0 12px; border-radius: 8px; font-weight: 650; }
    .btn.primary { border: 1px solid var(--mint); background: var(--mint); color: #fff; }
    .btn.secondary { border: 1px solid var(--line); background: #fff; }
    .btn.danger { border: 1px solid #e7b3b8; background: #fff; color: var(--red); }
    .btn:disabled { cursor: not-allowed; opacity: .45; }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 80; padding: 9px 13px; border: 1px solid var(--line); border-radius: 9px; background: #fff; box-shadow: var(--shadow); font-size: 11px; font-weight: 650; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: 150ms; }
    .toast.visible { transform: translate(-50%, 0); opacity: 1; }

    @media (max-width: 1050px) {
      .app { grid-template-columns: 238px minmax(0, 1fr); }
      .conversation-inner { width: calc(100% - 40px); }
      .conversation-path { display: none; }
      .project-button { max-width: 125px; }
      .composer-button { padding: 0 8px; }
    }

    /* Keep the CCB runtime powerful while making the everyday surface feel as
       direct and quiet as a dedicated AI tool. */
    :root {
      --ink: #20211f;
      --muted: #676963;
      --dim: #9b9d97;
      --line: #e9e9e5;
      --line-strong: #d9dad5;
      --sidebar: #f4f4f1;
      --soft: #f5f5f2;
      --active: #e8e8e4;
      --mint: #20211f;
      --mint-dark: #20211f;
      --mint-soft: #eeeeea;
      --shadow: 0 14px 42px rgba(24, 25, 23, .12);
    }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline-color: rgba(32, 33, 31, .18);
    }
    .app { grid-template-columns: 234px minmax(0, 1fr); }
    .sidebar { background: var(--sidebar); }
    .sidebar-head { height: 52px; padding: 0 12px 0 15px; }
    .brand-mark { display: none; }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    .text-button { min-height: 30px; padding: 0 8px; }
    .new-chat {
      height: 40px;
      margin: 1px 7px 15px;
      padding: 0 10px;
      border-radius: 7px;
      font-weight: 600;
      justify-content: flex-start;
      gap: 8px;
    }
    .new-chat .shortcut { margin-left: auto; opacity: .72; }
    .sidebar-scroll { padding: 0 6px 18px; }
    .section-head { height: 31px; padding: 0 9px; font-size: 10px; font-weight: 600; }
    .compact-action { min-width: 27px; height: 27px; font-size: 11px; }
    .project { margin-bottom: 2px; }
    .item-shell { border-radius: 6px; }
    .project-row { height: 32px; padding: 0 9px; display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; }
    .project-row .icon { width: 14px; height: 14px; color: #767871; }
    .session-row { min-height: 29px; padding: 4px 7px 4px 23px; font-size: 12px; }
    .session-shell.active { background: #e2e2de; }
    .sidebar-foot { min-height: 43px; padding: 7px 14px; border-top-color: transparent; }
    .status-dot { width: 7px; height: 7px; }
    .status-dot.ready { background: #3f9b65; }

    .main { grid-template-rows: 44px minmax(0, 1fr); }
    .main-head { padding: 0 16px; border-bottom-color: transparent; }
    .conversation-title { font-size: 13px; font-weight: 650; }
    .conversation-path { display: none; }
    .header-menu summary { min-width: 32px; height: 30px; }
    .conversation { padding: 38px 0 170px; }
    .conversation-inner { width: min(640px, calc(100% - 48px)); }
    .welcome { min-height: 300px; }
    .welcome h1 { font-size: 22px; letter-spacing: -.02em; }
    .welcome p { max-width: 460px; font-size: 13px; }
    .message { padding: 12px 0; }
    .user-bubble {
      max-width: min(560px, 82%);
      padding: 9px 13px;
      border-radius: 15px;
      background: #f3f3f0;
    }
    .message.agent { display: block; }
    .agent-mark, .message.agent .message-head { display: none; }
    .message-body { color: #292a27; line-height: 1.62; }
    .run-indicator { margin: 9px 0 13px; }
    .pulse { width: 7px; height: 7px; background: #696b65; box-shadow: 0 0 0 4px #efefeb; }
    .result-card, .error-card, .approval-card {
      margin: 11px 0 15px;
      padding: 12px 13px;
      border-radius: 10px;
    }
    .result-card {
      width: fit-content;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .result-card .card-title { margin: 0; color: var(--muted); font-size: 11px; font-weight: 600; }
    .result-card .card-copy { margin: 0; color: var(--muted); font-size: 11px; }
    .result-card .card-actions { margin: 0; }
    .result-card .card-button {
      min-height: auto;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .composer-wrap { padding: 14px 24px 8px; background: linear-gradient(180deg, rgba(255,255,255,0), #fff 28px); }
    .composer {
      width: min(640px, calc(100% - 8px));
      border-color: #dedfda;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(29, 30, 28, .08);
    }
    .composer:focus-within { border-color: #cfd0cb; box-shadow: 0 8px 24px rgba(29, 30, 28, .1); }
    .composer textarea { min-height: 88px; padding: 15px 15px 5px; }
    .composer-row { min-height: 44px; padding: 4px 7px 7px; }
    .composer-button { height: 31px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; color: #666862; }
    .project-control { display: none; }
    .model-effort-button { max-width: 210px; background: transparent; color: #31322f; }
    .model-effort-button:hover, .model-effort-button[aria-expanded="true"] { background: var(--soft); }
    .voice-button.listening { background: #ecece8; color: #20211f; }
    .send-button { width: 32px; min-width: 32px; height: 32px; padding: 0; display: inline-grid; place-items: center; border-radius: 50%; background: #1f201e; }
    .icon { width: 15px; height: 15px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .send-button .icon { width: 16px; height: 16px; }
    .send-button .stop-icon { display: none; }
    .send-button.stop-state .send-icon { display: none; }
    .send-button.stop-state .stop-icon { display: block; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .control-popover { border-radius: 12px; }
    .popover-option { border-radius: 8px; }
    .option-title .check, .effort-value { color: #20211f; }
    .effort-field input[type="range"] { accent-color: #20211f; }

    .activity { top: 44px; width: 340px; }
    .modal { border-radius: 13px; }
    .btn.primary { border-color: #20211f; background: #20211f; }

    @media (max-width: 1050px) {
      .app { grid-template-columns: 218px minmax(0, 1fr); }
      .conversation-inner { width: calc(100% - 40px); max-width: 640px; }
      .composer { max-width: 640px; }
    }

    /* Keep the composer in layout so multiline drafts never cover a reply. */
    .app { height: 100dvh; }
    .main { grid-column: 2; grid-template-rows: 44px minmax(0, 1fr) auto; }
    .composer-wrap { position: static; min-width: 0; background: #fff; }
    .conversation { padding-bottom: 24px; }
    .conversation-path { display: block; color: var(--muted); }
    .sidebar-toggle { flex: 0 0 auto; }
    .sidebar-close { display: none; }
    .app.sidebar-collapsed { grid-template-columns: 0 minmax(0, 1fr); }
    .app.sidebar-collapsed .sidebar { display: none; }
    .sidebar-backdrop { position: fixed; inset: 0; z-index: 35; border: 0; background: rgba(24, 27, 23, .25); }
    .welcome .btn { margin-top: 20px; font-size: 13px; }
    .item-shell:focus-within .item-menu summary { opacity: 1; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline-color: rgba(32, 33, 31, .55); }
    .composer textarea:focus-visible { outline-offset: -5px; border-radius: 15px; }
    @media (max-width: 880px) {
      .app, .app.sidebar-collapsed { grid-template-columns: minmax(0, 1fr); }
      .main { grid-column: 1; }
      .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 40; width: min(280px, 85vw); box-shadow: var(--shadow); }
      .sidebar-close { display: inline-flex; }
      .main-head { padding: 0 10px; gap: 7px; }
      .composer-wrap { padding: 10px 12px 8px; }
      .conversation-inner { width: calc(100% - 32px); }
      .composer { width: 100%; }
      .activity { width: min(340px, 100%); }
    }
    @media (max-width: 560px) {
      .conversation-path { max-width: 35%; }
      .composer-row { flex-wrap: wrap; }
      .model-effort-button { max-width: 165px; }
      .control-popover, .control-popover.align-right { position: fixed; left: 12px; right: 12px; bottom: 90px; width: auto; max-height: 55vh; overflow: auto; }
      .welcome { min-height: 230px; }
      .welcome h1 { font-size: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .conversation { scroll-behavior: auto; }
      .pulse { animation: none; }
      .toast { transition: none; }
    }
    .back-to-latest { display: block; margin: 0 auto 8px; padding: 7px 13px; border: 1px solid var(--line, #e5e7eb); border-radius: 18px; background: #fff; color: #374151; box-shadow: 0 2px 10px #0000000d; cursor: pointer; }
    .back-to-latest[hidden] { display: none; }
  </style>
</head>
<body>
  <!-- Interface icons are from Lucide (ISC License). -->
  <div class="app">
    <aside class="sidebar" id="workspaceSidebar" aria-label="项目与对话" data-i18n-aria="项目与对话">

        <div class="brand-mark" aria-hidden="true">C</div>

        <button class="text-button" id="returnWorkspace" type="button">

          <span data-i18n="返回">返回</span>
        </button>
      </header>
      <button class="new-chat" id="newSession" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"></path></svg>

        <span class="shortcut" id="newChatShortcut">Ctrl N</span>

        <div class="section-head">
          <span data-i18n="项目">项目</span>
          <button class="compact-action" id="newProject" type="button" data-i18n-title="新建项目" data-i18n-aria="新建项目">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
            <span class="sr-only" data-i18n="新建">新建</span>
          </button>

        <div id="projectList"></div>
        <div class="empty-projects" id="projectEmpty" data-i18n="新建项目并选择本地文件夹，然后直接输入任务。">新建项目并选择本地文件夹，然后直接输入任务。</div>
      </div>
      <footer class="sidebar-foot">
        <span class="status-dot" id="runtimeDot"></span>

    <main class="main">
      <header class="main-head">
        <button class="text-button sidebar-toggle" id="toggleSidebar" type="button" aria-controls="workspaceSidebar" aria-expanded="true" aria-label="显示或隐藏项目栏" data-i18n-aria="显示或隐藏项目栏">

        <div class="conversation-path" id="sessionMeta"></div>
        <span class="spacer"></span>
        <details class="header-menu" id="headerMenu">

              <span class="sr-only" data-i18n="添加">添加</span>
            </button>
            <input id="fileInput" type="file" multiple hidden accept=".txt,.md,.json,.jsonc,.yaml,.yml,.toml,.ini,.csv,.log,.js,.mjs,.cjs,.ts,.tsx,.jsx,.py,.rs,.go,.java,.c,.cc,.cpp,.h,.hpp,.css,.html,.xml,.sql,.sh,.ps1">

            <div class="composer-control project-control">
              <button class="composer-button project-button" id="projectButton" type="button" aria-expanded="false" aria-controls="projectPopover" data-i18n="选择项目">选择项目</button>

                <div class="popover-list" id="projectOptions"></div>

                  <span class="option-title" data-i18n="新建项目">新建项目</span>
                  <span class="option-copy" data-i18n="选择一个本地文件夹">选择一个本地文件夹</span>
                </button>
              </div>
            </div>

                <span id="permissionLabel">请求批准</span>
              </button>
              <div class="control-popover" id="permissionPopover" hidden>
                <div class="popover-title" data-i18n="权限">权限</div>
                <div class="popover-list">
                  <button class="popover-option" type="button" data-permission="controlled">
                    <span class="option-title"><span data-i18n="请求批准">请求批准</span><span class="check"></span></span>
                    <span class="option-copy" data-i18n="需要授权的操作会先询问你">需要授权的操作会先询问你</span>
                  </button>
                  <button class="popover-option" type="button" data-permission="readonly">
                    <span class="option-title"><span data-i18n="只读访问">只读访问</span><span class="check"></span></span>
                    <span class="option-copy" data-i18n="只允许读取和搜索项目">只允许读取和搜索项目</span>
                  </button>
                  <button class="popover-option" type="button" data-permission="full">
                    <span class="option-title"><span data-i18n="完全访问">完全访问</span><span class="check"></span></span>
                    <span class="option-copy" data-i18n="允许修改文件和执行命令">允许修改文件和执行命令</span>

      <footer>

        update();

        else query.addListener(update);

      function openModal(id) {

      function closeModal(id) {

      function handleGlobalKeydown(event) {
        if (ui.modalId) {
          if (event.key === 'Escape') {
            event.preventDefault();
            if (ui.modalId === 'fullAccessModal') cancelFullAccess();
            else closeModal(ui.modalId);
          } else trapFocus(event, $('#' + ui.modalId));
          return;
        }
        if (ui.narrow && ui.sidebarOpen) {
          if (event.key === 'Escape') { event.preventDefault(); setSidebarOpen(false, true); }
          else trapFocus(event, $('#workspaceSidebar'));
          return;
        }
        if (event.key === 'Escape') {

          closeControlPopovers();
          $('#activityPanel').hidden = true;
        }
        if ((event.ctrlKey || event.metaKey) && !event.altKey && !event.isComposing && event.key.toLowerCase() === 'n') {

      function activeProject() {
        return state.projects.find(function (project) { return project.id === state.activeProjectId; }) || null;
      }
      function activeSession() {
        var project = activeProject();
        return project && (project.sessions || []).find(function (session) { return session.id === state.activeSessionId; }) || null;
      }

      function normalizeSession(session) {
        session.model = session.model || 'default';
        session.effort = EFFORT_LEVELS.indexOf(session.effort) >= 0 ? session.effort : 'high';
        session.permission = session.permission || 'controlled';
        if (session.permission === 'full') session.permission = 'controlled';
        session.messages = Array.isArray(session.messages) ? session.messages : [];
        session.events = Array.isArray(session.events) ? session.events.slice(-80) : [];
        if (session.lastRequest && !validStoredDraft(session.lastRequest)) delete session.lastRequest;
        if (session.lastFailedRequest && !validStoredDraft(session.lastFailedRequest)) delete session.lastFailedRequest;
        return session;
      }

      function load() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY) || '[]';
          var parsed = JSON.parse(raw);
          state.projects = Array.isArray(parsed) ? parsed : [];
          state.projects.forEach(function (project) {
            project.path = friendlyPath(project.path);
            project.sessions = Array.isArray(project.sessions) ? project.sessions.map(normalizeSession) : [];
          });
          if (state.projects.length) state.activeProjectId = state.projects[0].id;
          loadComposerState();
        } catch (_error) {
          state.projects = [];
        }
      }

      function storageWarning() {
        if (state.storageWarningShown) return;
        state.storageWarningShown = true;
        showToast(english ? 'Local saving is unavailable or full. Keep this window open and copy important drafts before closing.' : '本地保存不可用或空间已满。请保留当前窗口，关闭前复制重要草稿。');
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.projects.map(function (project) {
            return { id: project.id, name: project.name, path: friendlyPath(project.path), sessions: project.sessions || [] };
          })));
          return true;
        } catch (_error) {
          // Storage failure must never turn an already accepted native send into
          // a failed request, or remove the in-memory conversation.
          storageWarning();
          return false;
        }
      }

      function composerKey(projectId, sessionId) {
        return JSON.stringify([projectId == null ? state.activeProjectId : projectId, sessionId == null ? state.activeSessionId : sessionId]);
      }

      function copyAttachments(files) {
        return (files || []).map(function (file) { return { name: file.name, content: file.content, size: new TextEncoder().encode(file.content).length }; });
      }

      function validStoredDraft(draft) {
        if (!draft || typeof draft.text !== 'string' || !Array.isArray(draft.attachments) || draft.attachments.length > 100) return false;
        var bytes = 0;
        for (var i = 0; i < draft.attachments.length; i += 1) {

          if (!file || typeof file.name !== 'string' || file.name.length > 512 || typeof file.content !== 'string' || file.content.indexOf('\u0000') >= 0) return false;

          if (bytes > TOTAL_FILE_LIMIT_BYTES) return false;
        }
        return new TextEncoder().encode(JSON.stringify(draft)).length <= MAX_DRAFT_BYTES;

      function captureDraft() {

        var key = composerKey();
        var text = $('#prompt').value;

        } else delete state.composerDrafts[key];
      }

      function persistComposerState() {
        clearTimeout(state.draftSaveTimer);

        var count = 0;
        var limited = false;
        Object.keys(state.composerDrafts).sort(function (a, b) {
          return state.composerDrafts[b].updatedAt - state.composerDrafts[a].updatedAt;

          var draft = state.composerDrafts[key];

          bytes += size;
          count += 1;

      function loadComposerState() {
        try {

      function markdownTableCells(line) {

      function renderAnswer(body, text) {

            var bar = document.createElement('div'); bar.className = 'markdown-code-bar';
            var language = document.createElement('span'); language.textContent = fence[2].trim() || (english ? 'Code' : '代码');
            var codeText = codeLines.join('\n');
            bar.appendChild(language); bar.appendChild(outputCopyButton(english ? 'Copy code' : '复制代码', codeText));
            var pre = document.createElement('pre'); var code = document.createElement('code'); code.textContent = codeText;
            pre.appendChild(code); block.appendChild(bar); block.appendChild(pre); body.appendChild(block);
            continue;
          }
          if (index + 1 < lines.length && line.indexOf('|') !== -1) {
            var headings = markdownTableCells(line), divider = markdownTableCells(lines[index + 1]);
            if (headings.length > 1 && headings.length <= 16 && divider.length === headings.length && divider.every(function (cell) { return /^:?-{3,}:?$/.test(cell); })) {

              headings.forEach(function (cell) { var th = document.createElement('th'); th.setAttribute('scope', 'col'); appendInlineMarkdown(th, cell); headerRow.appendChild(th); });
              thead.appendChild(headerRow); table.appendChild(thead);
              var tbody = document.createElement('tbody'); index += 2;
              while (index < lines.length && lines[index].trim() && lines[index].indexOf('|') !== -1) {
                var cells = markdownTableCells(lines[index]);
                if (cells.length !== headings.length) break;
                var row = document.createElement('tr');
                cells.forEach(function (cell) { var td = document.createElement('td'); appendInlineMarkdown(td, cell); row.appendChild(td); });

          if (list) {

            if (ordered && Number(list[2]) > 1) listNode.setAttribute('start', String(Number(list[2])));
            do {

              list = index < lines.length ? /^\s*(?:([-+*])|(\d+)\.)\s+(.+)$/.exec(lines[index]) : null;

            if (index + 1 < lines.length && lines[index].indexOf('|') !== -1 && markdownTableCells(lines[index + 1]).every(function (cell) { return /^:?-{3,}:?$/.test(cell); })) break;

          }

        }
      }

      }

      function renderActivity() {
        var session = activeSession();
        var events = session ? session.events || [] : [];
        var host = $('#eventLog');
        host.textContent = '';
        $('#eventEmpty').hidden = events.length > 0;
        events.forEach(function (event) {
          var item = document.createElement('div');
          item.className = 'log-item';
          var title = document.createElement('strong');
          title.textContent = eventLabel(event.kind, event.payload);
          var time = document.createElement('span');
          time.className = 'log-time';
          time.textContent = formatTime(event.time);
          title.appendChild(time);
          var copy = document.createElement('p');
          copy.textContent = eventDetail(event.kind, event.payload);
          item.appendChild(title);
          item.appendChild(copy);

      }

      function openActivity() {
        $('#activityPanel').hidden = false;
        $('#headerMenu').removeAttribute('open');

      function effortLabel(value) {
        return tr({ low: '快速', medium: '标准', high: '深度', xhigh: '极高', max: '最大' }[value] || '深度');
      }

      function modelLabel(value) {
        if (!value || value === 'default') return tr('默认');
        var label = value.replace(/^gpt-/i, 'GPT-').replace(/[_/]/g, ' ');
        label = label.replace(/-(sol|terra|luna)$/i, function (_match, name) {
          return ' ' + name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
        });
        return label;
      }

      function currentModel() { var session = activeSession(); return session ? session.model : state.draftModel; }
      function currentEffort() { var session = activeSession(); return session ? session.effort : state.draftEffort; }
      function currentPermission() { var session = activeSession(); return session ? session.permission : state.draftPermission; }

      function permissionLabel(value) {
        return tr(value === 'readonly' ? '只读访问' : value === 'full' ? '完全访问' : '请求批准');
      }

      function fillModels(models) {
        var select = $('#modelSelect');
        var current = currentModel();
        select.textContent = '';
        var values = models.length ? models.slice() : ['default'];

        });

        select.value = current;
        state.draftModel = current;
        var session = activeSession();
        if (session && values.indexOf(session.model) < 0) { session.model = current; save(); }
      }

      function renderAttachments() {
        var tray = $('#attachmentTray');
        tray.textContent = '';
        tray.hidden = state.attachments.length === 0;
        state.attachments.forEach(function (attachment, index) {
          var chip = document.createElement('div');

          name.textContent = attachment.name;

          remove.textContent = '×';
          remove.setAttribute('aria-label', (english ? 'Remove ' : '移除 ') + attachment.name);
          remove.addEventListener('click', function () {
            state.attachments.splice(index, 1);

      function syncControls() {
        var project = activeProject();
        var session = activeSession();
        var projectReady = Boolean(project);
        var runtimeReady = Boolean(state.status && state.status.available);
        var locked = Boolean(state.nativeSessionId);
        var busy = state.turnActive || state.starting;
        var promptHasValue = Boolean($('#prompt').value.trim() || state.attachments.length);

        $('#prompt').disabled = !projectReady || !runtimeReady;
        $('#addContext').disabled = !projectReady || !runtimeReady || busy;
        $('#permissionButton').disabled = !projectReady || locked || busy;
        $('#modelEffortButton').disabled = !projectReady || locked || busy;
        $('#modelSelect').disabled = locked || busy;
        var effortSupported = Boolean(state.status && state.status.capabilities && state.status.capabilities.effort);
        $('#effortRange').disabled = locked || busy || !effortSupported;
        $('#effortRange').title = effortSupported ? '' : (english ? 'This gateway does not advertise thinking-depth support.' : '当前网关未声明支持思考深度。');
        $('#voiceButton').disabled = !projectReady || !runtimeReady || !SpeechRecognition || busy;
        $('#voiceButton').title = !SpeechRecognition ? tr('当前系统不支持语音输入') : tr('语音输入');

        $('#send').disabled = busy ? !state.turnActive : !projectReady || !runtimeReady || !promptHasValue;
        $('#sendLabel').textContent = tr(state.turnActive ? '停止' : '发送');
        $('#send').setAttribute('aria-label', tr(state.turnActive ? '停止' : '发送'));
        $('#send').classList.toggle('stop-state', state.turnActive);

        $('#sessionHeading').textContent = session ? session.name : tr('新对话');
        $('#sessionMeta').textContent = project ? (ui.narrow ? project.name : friendlyPath(project.path)) : '';
        $('#sessionMeta').title = project ? friendlyPath(project.path) : '';
        $('#projectButton').textContent = project ? project.name : tr('选择项目');
        $('#permissionLabel').textContent = permissionLabel(currentPermission());

        $('#modelSelect').value = currentModel();

        $('#voiceButton').setAttribute('aria-label', tr(state.voiceActive ? '正在聆听' : '语音'));
        $('#voiceButton').classList.toggle('listening', state.voiceActive);

        $$('[data-permission]').forEach(function (button) {
          var selected = button.getAttribute('data-permission') === currentPermission();
          button.classList.toggle('selected', selected);
          $('.check', button).textContent = selected ? tr('当前') : '';

        $('#renameActiveSession').disabled = !session;
        $('#deleteActiveSession').disabled = !session;
      }

      async function closeNativeSession(clearOnline) {
        var id = state.nativeSessionId || state.closingSessionId;
        state.closingSessionId = id;
        state.nativeSessionId = '';
        state.turnActive = false;
        state.starting = false;
        state.pendingApprovals = {};
        var previous = state.closingPromise;
        var operation = (async function () {
          await previous;
          if (bridge && (id || clearOnline)) {
            await bridge.close({
              sessionId: id || null,
              clearOnline: clearOnline === true
            });
            if (id) {
              for (var attempt = 0; attempt < 45; attempt += 1) {
                var sessions = await bridge.listSessions();
                var pending = sessions.find(function (item) { return item.sessionId === id && (item.reaped === false || item.phase === 'running' || item.phase === 'closing'); });
                if (!pending) { state.closingSessionId = ''; return; }
                await new Promise(function (resolve) { window.setTimeout(resolve, 100); });
              }
              throw new Error(english ? 'The previous task is still closing. Please retry.' : '上一个任务仍在关闭，请稍后重试。');
            }
          }
        })();
        // Keep the queue recoverable, but propagate this operation's failure to
        // callers. A later send retries cleanup before starting another child.
        state.closingPromise = operation.catch(function (error) { showToast(safeText(error && error.message || error)); });
        return operation;
      }

      function selectProject(projectId) {

      function createProject() {

        state.projects.unshift(project);

      function renameProject(projectId) {
        var project = state.projects.find(function (item) { return item.id === projectId; });

      async function deleteProject(projectId) {
        var project = state.projects.find(function (item) { return item.id === projectId; });
        if (!project) return;
        var message = english ? 'Remove project "' + project.name + '"? Local files will not be deleted.' : '删除项目“' + project.name + '”？只会删除 Claritide 中的项目和对话记录，不会删除本地文件。';
        if (!window.confirm(message)) return;
        rememberDraft(true);
        if (projectId === state.activeProjectId) await closeNativeSession();
        Object.keys(state.composerDrafts).forEach(function (key) { if (JSON.parse(key)[0] === projectId) delete state.composerDrafts[key]; });
        state.projects = state.projects.filter(function (item) { return item.id !== projectId; });
        if (projectId === state.activeProjectId) {
          state.activeProjectId = state.projects[0] ? state.projects[0].id : '';
          state.activeSessionId = '';
          restoreDraft();
          scrollConversation(true);
        }
        persistComposerState();
        save();
        renderProjects();
        renderConversation();
        renderActivity();
        syncControls();
        showToast('项目已删除，本地文件夹和文件没有被删除');
      }

      function renameSession(sessionId) {
        var project = activeProject();
        var session = project && (project.sessions || []).find(function (item) { return item.id === sessionId; });
        if (!session) return;

      async function deleteSession(sessionId) {
        var project = activeProject();
        var session = project && (project.sessions || []).find(function (item) { return item.id === sessionId; });
        if (!session) return;
        if (!window.confirm(english ? 'Delete chat "' + session.name + '"?' : '删除对话“' + session.name + '”？')) return;
        rememberDraft(true);
        if (sessionId === state.activeSessionId) await closeNativeSession();
        delete state.composerDrafts[composerKey(project.id, sessionId)];
        project.sessions = project.sessions.filter(function (item) { return item.id !== sessionId; });
        if (sessionId === state.activeSessionId) { state.activeSessionId = ''; restoreDraft(); scrollConversation(true); }
        persistComposerState();
        save();
        renderProjects();
        renderConversation();
        renderActivity();
        syncControls();

      }

      function ensureConversation(value) {
        var session = activeSession();
        if (session) return session;
        var project = activeProject();
        if (!project) throw new Error(tr('选择项目'));
        session = normalizeSession({
          id: uid('session'),
          name: titleFromMessage(value),
          model: state.draftModel,
          effort: state.draftEffort,
          permission: state.draftPermission,
          updatedAt: Date.now(),
          messages: [],
          events: []
        });
        if (state.draftPermission === 'full') {
          session.permission = 'full';
          state.fullAccessGrants[session.id] = true;
        }
        captureDraft();
        delete state.composerDrafts[composerKey(project.id, '')];
        project.sessions.unshift(session);
        state.activeSessionId = session.id;
        rememberDraft(true);
        save();
        renderProjects();
        syncControls();
        return session;
      }

      function setPermission(value) {
        var session = activeSession();
        closeControlPopovers();
        if (value === 'full') {
          state.pendingFullAccess = { sessionId: session && session.id || '', draft: !session };
          openModal('fullAccessModal');
          syncControls();
          return;
        }
        if (session) {
          session.permission = value;
          delete state.fullAccessGrants[session.id];
          save();
        } else {
          state.draftPermission = value;
        }
        syncControls();
        showToast('权限模式已更新');
      }

      function cancelFullAccess() {
        state.pendingFullAccess = null;
        closeModal('fullAccessModal');
        syncControls();
      }

      function confirmFullAccess() {
        var pending = state.pendingFullAccess;
        state.pendingFullAccess = null;
        closeModal('fullAccessModal');
        if (!pending) return syncControls();
        var session = activeSession();
        if (pending.draft) state.draftPermission = 'full';
        else if (session && session.id === pending.sessionId) {
          session.permission = 'full';
          state.fullAccessGrants[session.id] = true;
          save();
        }
        syncControls();
        showToast('已为本对话启用完全访问');
      }

      function setModel(value) {
        var session = activeSession();
        if (state.nativeSessionId) return showToast('会话运行后请新建对话再切换模型、思考深度或权限。');
        if (session) { session.model = value; save(); }
        else state.draftModel = value;
        syncControls();
      }

      function setEffort(value) {
        if (EFFORT_LEVELS.indexOf(value) < 0) return;
        var session = activeSession();
        if (state.nativeSessionId) return showToast('会话运行后请新建对话再切换模型、思考深度或权限。');
        if (session) { session.effort = value; save(); }
        else state.draftEffort = value;
        syncControls();
      }

      function toolActivity(tool) {
        var value = safeText(tool).toLowerCase();
        if (/read/.test(value)) return tr('正在读取项目');
        if (/glob|grep|search|lsp/.test(value)) return tr('正在搜索代码');
        if (/edit|write|notebook/.test(value)) return tr('正在修改文件');
        if (/bash|powershell|execute|terminal/.test(value)) return tr('正在执行命令');
        if (/web|chrome|browser/.test(value)) return tr('正在搜索网页');
        if (/agent|task|team|workflow/.test(value)) return tr('正在分派任务');
        return tr('正在处理任务');
      }

      async function ensureNativeSession() {
        await state.closingPromise;
        if (state.closingSessionId) await closeNativeSession();
        var project = activeProject();
        var session = activeSession();
        if (!project || !session) throw new Error(tr('选择项目'));
        if (session.permission === 'full' && !state.fullAccessGrants[session.id]) {
          throw new Error(english ? 'Full access must be confirmed again for this app run.' : '完全访问需要在本次应用运行期间重新确认');
        }
        if (!project.nativeWorkspace) {
          var workspace = await bridge.selectWorkspace();
          if (!workspace) throw new Error(english ? 'Choose the project folder again.' : '需要重新授权项目文件夹');
          project.nativeWorkspace = workspace;
          project.path = friendlyPath(workspace.path || project.path);
          save();
          renderProjects();
        }
        var id = session.runtimeSessionId || crypto.randomUUID();
        var existing = (await bridge.listSessions()).find(function (item) { return item.sessionId === id && item.phase === 'running' && item.reaped !== true; });
        if (existing) {
          if (existing.permission === session.permission && existing.model === session.model && existing.effort === session.effort && existing.workspaceId === project.nativeWorkspace.id) {
            state.nativeSessionId = id; return id;
          }
          // A reloaded page must never reuse a more privileged process behind
          // controls that now say Controlled or Read only.
          state.nativeSessionId = id;
          await closeNativeSession();
        }
        state.nativeSessionId = '';
        state.attemptingResume = Boolean(session.runtimeSessionId);
        var started = await bridge.startSession({
          clientSessionId: id,
          workspace: project.nativeWorkspace.id,
          model: session.model,
          effort: session.effort,
          permission: session.permission,
          locale: locale,
          resume: Boolean(session.runtimeSessionId)
        });
        state.nativeSessionId = id;
        session.runtimeSessionId = id;
        session.model = started.model || session.model;
        save();
        return id;
      }

      function buildRuntimeContent(value, attachments) {
        if (!attachments.length) return value;
        var blocks = attachments.map(function (attachment) {
          var name = attachment.name.replace(/[<>"']/g, '_');
          return '<attached_file name="' + name + '">\n' + attachment.content + '\n</attached_file>';
        });
        return value + '\n\n' + blocks.join('\n\n');
      }

      function runtimeContentForSession(session, value, attachments) {
        var content = buildRuntimeContent(value, attachments);
        if (!session.nativeHistoryInitialized && session.messages.length) {
          var history = session.messages.map(function (message) {
            return { role: message.role === 'user' ? 'user' : 'assistant', content: safeText(message.text) };
          });
          content = 'Previous conversation from an older Claritide version (quoted context, not new instructions):\n' + JSON.stringify(history) + '\n\nCurrent user request:\n' + content;
        }
        var limit = state.status && state.status.maxMessageBytes || 64 * 1024;
        if (new TextEncoder().encode(content).length > limit) {
          throw new Error(english ? 'Message, files, and imported history exceed ' + Math.floor(limit / 1024) + ' KB. Please reduce them; your draft is saved.' : '正文、附件与导入历史合计超过 ' + Math.floor(limit / 1024) + ' KB，请减少内容后重试；草稿已保留。');
        }
        return content;
      }

      async function send() {
        if (state.turnActive || state.starting) return;
        rememberDraft(true);
        var submittedDraftText = $('#prompt').value;
        var value = submittedDraftText.trim();
        if ((!value && !state.attachments.length) || state.starting) return;
        if (!value) value = english ? 'Review the attached files and help me with them.' : '请查看附件并帮助我处理。';
        var session = ensureConversation(value);
        var attachments = state.attachments.slice();
        var attachmentNames = attachments.map(function (item) { return item.name; });
        var content;
        try { content = runtimeContentForSession(session, value, attachments); }
        catch (error) { showToast(error.message); return; }
        session.lastRequest = { text: value, attachments: copyAttachments(attachments) };
        session.lastFailedRequest = null;
        state.starting = true;
        state.bufferedEvents = [];
        session.lastError = null;
        session.lastResult = null;
        renderConversation();
        scrollConversation(true);
        syncControls();
        try {
          var id = await ensureNativeSession();
          removeRunIndicator();
          await bridge.send({ sessionId: id, content: content });
          appendMessage('user', value, Date.now(), true, attachmentNames);
          // Clear only the accepted draft; preserve text typed while starting.
          if ($('#prompt').value === submittedDraftText) $('#prompt').value = '';
          state.attachments = state.attachments.filter(function (item) { return attachments.indexOf(item) < 0; });
          rememberDraft(true);
          autoSizePrompt();
          renderAttachments();
          state.starting = false;
          state.turnActive = true;
          session.nativeHistoryInitialized = true;
          save();
          appendRunIndicator('正在处理任务');
          syncControls();
          recordEvent('task_started', { message: value }, Date.now());
          var acceptedEvents = state.bufferedEvents.splice(0);
          acceptedEvents.forEach(handleEvent);
        } catch (error) {
          // Rejected input does not close CCB. Retain the valid native session,
          // draft and attachments so retry cannot strand the one-process slot.
          state.starting = false;
          state.turnActive = false;
          state.bufferedEvents = [];
          removeRunIndicator();
          var message = safeText(error && error.message || error);
          session.lastError = { code: state.nativeSessionId ? 'send_failed' : 'start_failed', message: message, time: Date.now() };
          session.lastFailedRequest = session.lastRequest;
          rememberDraft(true);
          save();
          appendErrorCard(message, false);
          recordEvent('error', { code: session.lastError.code, message: message, terminal: true }, Date.now());
          syncControls();
        }
      }

      async function stop() {
        if (!state.nativeSessionId || !state.turnActive) return;
        try {
          await bridge.stop({ sessionId: state.nativeSessionId });
          showToast('已发送停止请求');
        } catch (error) {
          showToast((english ? 'Failed to stop: ' : '停止失败：') + safeText(error && error.message || error));
        }
      }

      async function returnToWorkspace() {
        rememberDraft(true);
        await closeNativeSession(true);
        window.location.assign(WORKSPACE_URL);
      }

      function handleEvent(event) {
        if (event.sessionId && event.sessionId !== state.nativeSessionId) return;
        if (state.starting && event.sessionId) { state.bufferedEvents.push(event); return; }
        var payload = event.payload || {};
        var session = activeSession();
        if (!session) return;

        if (event.type === 'approval_requested') {
          state.pendingApprovals[payload.requestId] = payload;
          renderApproval(payload);
          updateRunIndicator(english ? 'Waiting for your approval' : '等待你的批准');
        } else if (event.type === 'approval_resolved') {
          delete state.pendingApprovals[payload.requestId];
          var resolvedCard = document.getElementById('approval-' + safeText(payload.requestId));
          if (resolvedCard) resolvedCard.remove();
        } else if (event.type === 'text_delta') {
          var last = $('#conversationInner .message.agent:last-of-type .message-body');
          if (!last || !last._streaming) last = appendMessage('agent', '', Date.now(), false);
          last._streaming = true;
          last._markdownSource = safeText(last._markdownSource) + safeText(payload.text);
          last.classList.remove('formatted');
          last.textContent = last._markdownSource;
        } else if (event.type === 'assistant_final') {
          state.attemptingResume = false;
          var finalBody = $('#conversationInner .message.agent:last-of-type .message-body');
          if (!finalBody || !finalBody._streaming) finalBody = appendMessage('agent', '', Date.now(), false);
          var answerSource = typeof payload.text === 'string' ? payload.text : safeText(finalBody._markdownSource);
          renderAnswer(finalBody, answerSource);
          session.messages.push({ role: 'agent', text: answerSource, time: Date.now(), attachments: [] });
          session.updatedAt = Date.now();
          save();
        } else if (event.type === 'tool_started') {
          updateRunIndicator(toolActivity(payload.tool || payload.toolName));
        } else if (event.type === 'turn_completed') {
          clearApprovalCards();
          state.turnActive = false;
          state.starting = false;
          removeRunIndicator();
          session.lastResult = payload;
          session.lastError = null;
          session.lastFailedRequest = null;
          save();
          appendResultCard(payload);
        } else if (event.type === 'error') {
          var approvalUnsupported = payload.code === 'tool_approval_unsupported';
          session.lastError = { code: payload.code, message: safeText(payload.message || payload.code), time: Date.now() };
          if (payload.terminal === true || approvalUnsupported) session.lastFailedRequest = session.lastRequest || null;
          save();
          if (payload.code === 'interrupt_failed') showToast(payload.message || (english ? 'Failed to stop. Please retry.' : '停止失败，请重试。'));
          if (payload.terminal === true || approvalUnsupported) {
            state.turnActive = false;
            state.starting = false;
            removeRunIndicator();
            if (payload.terminal === true) { state.closingSessionId = state.nativeSessionId; state.nativeSessionId = ''; }
            if (payload.terminal === true) clearApprovalCards();
            appendErrorCard(payload.message || payload.code, approvalUnsupported);
          }
        } else if (event.type === 'stopped') {
          clearApprovalCards();
          state.turnActive = Boolean(payload.settling);
          if (!payload.settling) {
            state.nativeSessionId = '';
            removeRunIndicator();
          }
        }

        if (event.type !== 'text_delta' && event.type !== 'assistant_final') {
          recordEvent(event.type, payload, event.timestampMs || Date.now());
        }
        syncControls();
        scrollConversation();
      }

      async function addFiles(files) {
        var ownerKey = composerKey();
        var total = state.attachments.reduce(function (sum, item) { return sum + item.size; }, 0);
        for (var index = 0; index < files.length; index += 1) {
          var file = files[index];
          if (state.attachments.length >= 100) { showToast(english ? 'Up to 100 text files per draft.' : '每份草稿最多添加 100 个文本文件。'); break; }
          if (file.size > FILE_LIMIT_BYTES) {
            showToast(tr('文件过大') + ': ' + file.name);
            continue;
          }
          if (total + file.size > TOTAL_FILE_LIMIT_BYTES) {
            showToast(english ? 'Files total cannot exceed 64 KB; the message must fit too.' : '附件合计不能超过 64 KB，正文也计入总大小。');
            break;
          }
          try {
            var content = await file.text();
            if (ownerKey !== composerKey() || state.turnActive || state.starting) break;
            if (content.indexOf('\u0000') >= 0) throw new Error('binary');
            var size = new TextEncoder().encode(content).length;
            if (size > FILE_LIMIT_BYTES || total + size > TOTAL_FILE_LIMIT_BYTES) { showToast(tr('文件过大') + ': ' + file.name); continue; }
            state.attachments.push({ name: file.name.slice(0, 512), content: content, size: size });
            total += size;
            showToast(tr('已添加文件') + ': ' + file.name);
          } catch (_error) {
            showToast(tr('仅支持文本文件') + ': ' + file.name);
          }
        }
        $('#fileInput').value = '';
        rememberDraft(true);
        renderAttachments();
        syncControls();
      }

      function toggleVoice() {
        if (!SpeechRecognition) return showToast('当前系统不支持语音输入');
        if (state.voiceActive && recognition) {
          recognition.stop();
          return;
        }
        var voiceOwnerKey = composerKey();
        recognition = new SpeechRecognition();
        recognition.lang = english ? 'en-US' : 'zh-CN';
        recognition.interimResults = false;
        recognition.continuous = true;
        recognition.onstart = function () { state.voiceActive = true; syncControls(); };
        recognition.onend = function () { state.voiceActive = false; syncControls(); };
        recognition.onerror = function () { state.voiceActive = false; syncControls(); showToast('语音识别失败'); };
        recognition.onresult = function (event) {
          if (voiceOwnerKey !== composerKey()) { recognition.stop(); return; }
          var text = '';
          for (var index = event.resultIndex; index < event.results.length; index += 1) {
            if (event.results[index].isFinal) text += event.results[index][0].transcript;
          }
          if (text) {
            var prompt = $('#prompt');
            prompt.value = (prompt.value ? prompt.value + ' ' : '') + text.trim();
            rememberDraft();
            autoSizePrompt();
            syncControls();
          }
        };
        try { recognition.start(); }
        catch (_error) { showToast('语音识别失败'); }
      }

      function autoSizePrompt() {
        var prompt = $('#prompt');
        prompt.style.height = 'auto';
        prompt.style.height = Math.min(prompt.scrollHeight, 160) + 'px';
      }

      function onSendClick() {
        if (state.turnActive) return stop();
        return send();
      }

      function onPromptKeydown(event) {
        if (event.isComposing || event.keyCode === 229) return;
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          if (state.turnActive || state.starting) {
            rememberDraft(true);
            showToast(english ? 'Draft kept. Send it after the current task finishes.' : '草稿已保留，当前任务结束后可手动发送。');
            return;
          }
          void send();
        }
      }

      function bind() {
        $('#toggleSidebar').addEventListener('click', function () { setSidebarOpen(!ui.sidebarOpen, true); });
        $('#closeSidebar').addEventListener('click', function () { setSidebarOpen(false, true); });
        $('#sidebarBackdrop').addEventListener('click', function () { setSidebarOpen(false, true); });
        $('#projectList').addEventListener('click', function (event) {
          if (ui.narrow && !state.turnActive && !state.starting && event.target.closest('.project-row, .session-row')) setSidebarOpen(false, true);
        });
        $('#newProject').addEventListener('click', openProjectModal);
        $('#createProjectFromPopover').addEventListener('click', openProjectModal);
        $('#newSession').addEventListener('click', newConversation);
        $('#chooseFolder').addEventListener('click', chooseWorkspace);
        $('#createProject').addEventListener('click', createProject);
        $('#returnWorkspace').addEventListener('click', returnToWorkspace);
        $('#projectButton').addEventListener('click', function () { toggleControlPopover('project'); });
        $('#permissionButton').addEventListener('click', function () { toggleControlPopover('permission'); });
        $('#modelEffortButton').addEventListener('click', function () { toggleControlPopover('modelEffort'); });
        $$('[data-permission]').forEach(function (button) {
          button.addEventListener('click', function () { setPermission(button.getAttribute('data-permission')); });
        });
        $('#modelSelect').addEventListener('change', function (event) { setModel(event.target.value); });
        $('#effortRange').addEventListener('input', function (event) { setEffort(EFFORT_LEVELS[Number(event.target.value)]); });
        $('#addContext').addEventListener('click', function () { $('#fileInput').click(); });
        $('#fileInput').addEventListener('change', function (event) { void addFiles(Array.prototype.slice.call(event.target.files || [])); });
        $('#voiceButton').addEventListener('click', toggleVoice);
        $('#send').addEventListener('click', onSendClick);
        $('#prompt').addEventListener('input', function () { rememberDraft(); autoSizePrompt(); syncControls(); });
        $('#prompt').addEventListener('keydown', onPromptKeydown);
        $('#conversation').addEventListener('scroll', onConversationScroll, { passive: true });
        $('#backToLatest').addEventListener('click', function () { scrollConversation(true); });
        window.addEventListener('pagehide', function () { rememberDraft(true); });
        $('#showActivity').addEventListener('click', openActivity);
        $('#closeActivity').addEventListener('click', function () { $('#activityPanel').hidden = true; });
        $('#renameActiveSession').addEventListener('click', function () { var session = activeSession(); if (session) renameSession(session.id); $('#headerMenu').removeAttribute('open'); });
        $('#deleteActiveSession').addEventListener('click', function () { var session = activeSession(); if (session) void deleteSession(session.id); $('#headerMenu').removeAttribute('open'); });
        $('#cancelFullAccess').addEventListener('click', cancelFullAccess);
        $('#cancelFullAccessTop').addEventListener('click', cancelFullAccess);
        $('#confirmFullAccess').addEventListener('click', confirmFullAccess);
        $$('[data-close]').forEach(function (button) {
          button.addEventListener('click', function () { closeModal(button.getAttribute('data-close')); });
        });
        $$('.modal-backdrop').forEach(function (backdrop) {
          backdrop.addEventListener('click', function (event) {
            if (event.target !== backdrop) return;
            if (backdrop.id === 'fullAccessModal') cancelFullAccess();
            else closeModal(backdrop.id);
          });
        });
        document.addEventListener('click', function (event) {
          if (!event.target.closest('details')) closeMenus();
          if (!event.target.closest('.composer-control')) closeControlPopovers();
        });
        document.addEventListener('keydown', handleGlobalKeydown);
      }

      async function refreshRuntimeStatus() {
        if (!bridge || state.statusRefreshing) return;
        state.statusRefreshing = true;
        try {
          state.status = await bridge.getStatus();
          var expires = Number(state.status.authorizationExpiresAtMs || 0);
          var remaining = expires ? expires - Date.now() : 0;
          var expired = !state.status.available;
          var needsAuthorization = expired && /sign in|authoriz|expired|online ai/i.test(state.status.lastError || '');
          var expiring = expires && remaining < 120000;
          $('#runtimeStatus').textContent = expired ? (needsAuthorization ? (english ? 'AI authorization required' : 'AI 需要重新授权') : tr('Agent 不可用')) : expiring ? (english ? 'AI authorization expires soon' : 'AI 授权即将到期') : tr('Agent 已就绪');
          $('#runtimeStatus').title = safeText(state.status.lastError || (expires ? (english ? 'Authorization expires: ' : '授权到期：') + new Date(expires).toLocaleTimeString(locale) : ''));
          $('#runtimeDot').classList.toggle('ready', !expired);
          var renew = $('#renewAuthorization');
          if (!renew) {
            renew = document.createElement('button');
            renew.id = 'renewAuthorization'; renew.type = 'button'; renew.className = 'text-button';
            renew.textContent = english ? 'Renew access' : '重新授权';
            renew.addEventListener('click', returnToWorkspace);
            $('#runtimeStatus').parentNode.appendChild(renew);
          }
          renew.hidden = !needsAuthorization && !expiring;
          renew.disabled = state.turnActive || state.starting;
          renew.title = english ? 'Your conversation is saved. Return to My Day, reopen AI Workbench, and select this chat to continue.' : '对话已保存。返回我的今天，重新打开 AI 工作台后选择此对话即可继续。';
          fillModels(state.status.allowedModels || []);
        } catch (error) {
          state.status = { available: false };
          $('#runtimeStatus').textContent = tr('运行时检查失败');
          $('#runtimeStatus').title = safeText(error && error.message || error);
          $('#runtimeDot').classList.remove('ready');
        } finally {
          state.statusRefreshing = false;
          syncControls();
        }
      }

      async function init() {
        applyTranslations();
        initLayout();
        load();
        restoreDraft();
        bind();
        renderProjects();
        renderConversation();
        renderAttachments();
        renderActivity();
        if (!bridge) {
          $('#runtimeStatus').textContent = tr('本地桥接不可用');
          syncControls();
          return;
        }
        bridge.onEvent(handleEvent);
        await refreshRuntimeStatus();
        window.setInterval(refreshRuntimeStatus, 15000);
        syncControls();
        // Confirm the document is usable only after its controls and native
        // status have initialized. Queuing a WebView navigation is not enough.
        try {
          await bridge.markReady();
        } catch (error) {
          $('#runtimeStatus').textContent = english ? 'Workbench opening failed' : '工作台打开失败';
          $('#runtimeStatus').title = safeText(error && error.message || error);
          showToast((english ? 'Unable to confirm workbench startup: ' : '工作台启动确认失败：') + safeText(error && error.message || error));
        }
      }

      void init();
    })();
  </script>
</body>
